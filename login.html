<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>シェアブック報告書 ログイン</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #eef2f6;
        color: #20242a;
        font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 34px rgba(16, 24, 40, 0.14);
      }
      h1 { margin: 0 0 18px; font-size: 22px; letter-spacing: 0; }
      label { display: grid; gap: 8px; font-size: 14px; font-weight: 700; }
      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid #c9d2df;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }
      button {
        width: 100%;
        min-height: 44px;
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        background: #006c67;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .error { display: none; margin: 0 0 14px; color: #b42318; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>シェアブック報告書</h1>
      <p id="errorMessage" class="error">パスワードが違います。</p>
      <form method="post" action="/login">
        <label>
          パスワード
          <input name="password" type="password" autocomplete="current-password" autofocus required>
        </label>
        <button type="submit">開く</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("error")) {
        document.getElementById("errorMessage").style.display = "block";
      }
    </script>
  </body>
</html>
