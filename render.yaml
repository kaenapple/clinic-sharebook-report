services:
  - type: web
    name: clinic-sharebook-report
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: APP_PASSWORD
        value: 1234
      - key: REPORT_TO_EMAIL
        sync: false
      - key: REPORT_FROM_EMAIL
        sync: false
      - key: REPORT_FROM_NAME
        value: シェアブック報告書
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_CONNECTION_TIMEOUT
        value: 30000
      - key: SMTP_GREETING_TIMEOUT
        value: 30000
      - key: SMTP_SOCKET_TIMEOUT
        value: 60000
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
